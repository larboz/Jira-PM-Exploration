name: Daily Jira Update

on:
  schedule:
    # 12:00 UTC = 6am Central Standard Time (7am during Central Daylight Time,
    # since GitHub Actions cron runs on a fixed UTC time and doesn't shift for DST)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run daily update
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
        run: python -m jira_sim.daily_update

      - name: Rebuild status dashboard
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python -m jira_sim.build_dashboard

      - name: Rebuild weekly status
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python -m jira_sim.build_weekly_status

      - name: Commit updated state and dashboard
        run: |
          git config user.name "jira-sim-bot"
          git config user.email "actions@github.com"
          git add state/cycle_state.json state/weekly_snapshot.json docs/index.html docs/weekly.html docs/history/
          git diff --cached --quiet || git commit -m "Daily update: $(date -u +%Y-%m-%d)"
          git push
