name: Rebuild Dashboard Only

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rebuild status dashboard
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python -m jira_sim.build_dashboard

      - name: Rebuild weekly status
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python -m jira_sim.build_weekly_status

      - name: Commit updated state and dashboard
        run: |
          git config user.name "jira-sim-bot"
          git config user.email "actions@github.com"
          git add state/cycle_state.json state/weekly_snapshot.json docs/index.html docs/weekly.html docs/history/
          git diff --cached --quiet || git commit -m "Rebuild dashboard: $(date -u +%Y-%m-%d)"
          git push
