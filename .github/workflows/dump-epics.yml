name: Dump Cycle 1 Epics

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Dump epics
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python -m jira_sim.dump_epics

      - name: Commit dump
        run: |
          git config user.name "jira-sim-bot"
          git config user.email "actions@github.com"
          git add epics_dump.json
          git commit -m "Temporary: Cycle 1 epics dump" || true
          git push
